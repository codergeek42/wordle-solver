name: Continuous Integration
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PYTHON_VERSION: '3.x'

# TODO: Need to figure out to remove a lot of this redunant definition between
# jobs, e.g., checkout, unpack, setup-node, do the thing, pack tarball, upload
# artifact. Composite action?
jobs:
  Checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - name: Create source tarball artifact
        run: tar -cf source.tar ./*
      - name: Upload source tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-checkout
          path: source.tar

  Flake8:
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
      - name: Download source tarball
        uses: actions/download-artifact@v4
        with:
          name: source-checkout
      - name: Unpack source tarball
        run: tar -xf source.tar
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Run Flake8
        run: flake8 .
    
  UnitTest:
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
      - name: Download source tarball
        uses: actions/download-artifact@v4
        with:
          name: source-checkout
      - name: Unpack source tarball
        run: tar -xf source.tar
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Run Unit Tests
        run: echo TODO 